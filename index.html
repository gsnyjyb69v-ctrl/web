<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魁儡花</title>
  <style>
    /* 移除手機與平板點擊時出現的藍色/灰色高亮邊框 */
    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* 正方形容器：2048x2048 比例 */
    .interactive-wrapper {
      position: relative;
      width: 90vw;
      max-width: 650px;
      aspect-ratio: 1 / 1;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    .interactive-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hotspot-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 熱點基礎設定：平時完全隱形無框線，僅保留滑鼠指標 */
    .hotspot {
      pointer-events: auto;
      fill: transparent;
      stroke: none;
      cursor: pointer;
    }

    /* 點擊後產生的瞬間光點效果 (持續 0.1 秒) */
    .click-ripple {
      position: absolute;
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
      animation: rippleEffect 0.1s linear forwards;
      z-index: 50;
    }

    @keyframes rippleEffect {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0;
      }
    }

    /* 對話框樣式：支援自動斷行與多行文字顯示 */
    .dialog-box {
      position: absolute;
      bottom: -180px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      opacity: 0;
      pointer-events: auto;
      cursor: pointer;
      text-align: center;
      max-width: 85%;
      white-space: pre-line; /* 支援文字內部的換行符號 */
      z-index: 100;
    }

    .dialog-box.active {
      bottom: 20px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="interactive-wrapper" id="wrapper">
    <!-- 背景圖片，透過 JavaScript 動態切換 -->
    <img id="bgImage" src="傀儡花_羅妹號.png" alt="魁儡花首頁背景" class="interactive-image">

    <!-- viewBox 設定為 2048 2048，精準對齊像素 -->
    <svg class="hotspot-svg" viewBox="0 0 2048 2048" preserveAspectRatio="none" id="hotspotSvg">
      <!-- 熱點將由 JavaScript 根據當前頁面動態載入 -->
    </svg>

    <!-- 對話框元件（點擊時會立即關閉） -->
    <div id="dialog" class="dialog-box" onclick="closeDialog()"></div>
  </div>

  <!-- 循環背景音樂 -->
  <audio id="bgmAudio" src="背景音.wav" loop preload="auto"></audio>

  <!-- 背景語音物件 -->
  <audio id="bgAudio" src="傀儡花大綱.m4a" preload="auto"></audio>

  <!-- 若要使用自訂點擊音效檔，可將 USE_CUSTOM_CLICK_FILE 改為 true 並填入檔名 -->
  <audio id="clickSoundAudio" src="點擊音效.wav" preload="auto"></audio>

  <script>
    let timer = null;
    let currentPage = 1; // 預設為首頁一 (羅妹號)

    const bgmAudio = document.getElementById('bgmAudio');
    const audio = document.getElementById('bgAudio');
    const clickSoundAudio = document.getElementById('clickSoundAudio');

    // 音量設定
    const NORMAL_BGM_VOLUME = 0.6; // 背景音正常音量（60%，可依需求調整 0.0 ~ 1.0）
    const DUCKED_BGM_VOLUME = 0.05; // 傀儡花大綱.m4a 播放時背景音音量（5%）
    const CLICK_SFX_VOLUME = 0.1;   // 點擊回饋音效音量（10%）
    const USE_CUSTOM_CLICK_FILE = false; // 若要改用 clickSoundAudio 檔案，請設為 true

    let webAudioCtx = null;
    let bgmStarted = false;

    // 初始化背景音正常音量
    bgmAudio.volume = NORMAL_BGM_VOLUME;
    clickSoundAudio.volume = CLICK_SFX_VOLUME;

    // 同步背景音音量：若「傀儡花大綱.m4a」正在播放（且未暫停/結束），則切為 5%，否則切回正常音量
    function syncBgmVolume() {
      const isNarrationPlaying = !audio.paused && !audio.ended && audio.currentTime > 0;
      bgmAudio.volume = isNarrationPlaying ? DUCKED_BGM_VOLUME : NORMAL_BGM_VOLUME;
    }

    // 監聽「傀儡花大綱.m4a」播放狀態變化
    audio.addEventListener('play', () => {
      bgmAudio.volume = DUCKED_BGM_VOLUME;
    });
    audio.addEventListener('playing', () => {
      bgmAudio.volume = DUCKED_BGM_VOLUME;
    });
    audio.addEventListener('pause', () => {
      syncBgmVolume();
    });
    audio.addEventListener('ended', () => {
      bgmAudio.volume = NORMAL_BGM_VOLUME;
    });

    // 嘗試啟動循環播放「背景音.wav」
    function ensureBgmPlaying() {
      syncBgmVolume();
      if (!bgmAudio.paused) {
        bgmStarted = true;
        return;
      }
      bgmAudio.play().then(() => {
        bgmStarted = true;
      }).catch(() => {
        // 瀏覽器或 iPadOS 阻擋自動播放時，等待使用者互動再觸發
      });
    }

    // 播放點擊回饋音效（音量 10%）
    function playClickFeedback() {
      if (USE_CUSTOM_CLICK_FILE) {
        try {
          clickSoundAudio.volume = CLICK_SFX_VOLUME;
          clickSoundAudio.currentTime = 0;
          clickSoundAudio.play().catch(() => {});
        } catch (_) {}
        return;
      }

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!webAudioCtx) {
          webAudioCtx = new AudioCtx();
        }
        if (webAudioCtx.state === 'suspended') {
          webAudioCtx.resume();
        }

        const now = webAudioCtx.currentTime;
        const osc = webAudioCtx.createOscillator();
        const gain = webAudioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(240, now + 0.045);

        // 限制在 10% 音量區間內做淡出，避免爆音
        gain.gain.setValueAtTime(CLICK_SFX_VOLUME, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

        osc.connect(gain);
        gain.connect(webAudioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.055);
      } catch (_) {}
    }

    // 定義各個頁面的背景圖與對應的熱點資料
    const pagesData = {
      1: {
        bg: "傀儡花_羅妹號.png",
        hotspots: [
          { 
            d: "M 0,0 L 2048,0 L 2048,2048 L 0,2048 Z", 
            text: "關於我們選用的畫面分為以下四幕：\n第一幕採用「羅妹號事件」的緣起，\n第二幕則是客家與平埔族等多元族群混居的「瑯嶠社寮」，\n第三幕將目光放在「斯卡羅」原住民的居住場所，\n第四幕「出火」，是本事件的暫時停損點，\n也是原住民與西方簽訂〈南岬之盟〉的關鍵談判場域。", 
            type: "guide" 
          },
          { d: "M 1696,1965 L 2034,1958 L 2037,2040 L 1699,2036 Z", text: "文學水墨數位轉譯", type: "dialog" },
          { d: "M 24,1732 L 338,1732 L 334,2023 L 20,2026 Z", text: "點擊任一處可跳出解說文字框", type: "dialog" },
          { d: "M 143,132 L 614,121 L 665,388 L 146,391 Z", text: "傀儡花，作者陳耀昌。", type: "dialog" },
          { d: "M 348,456 L 1413,452 L 1416,1548 L 375,1538 L 334,1538 Z", text: "羅妹號", type: "link", target: "序幕.html", delay: 300 },
          { d: "M 1525,381 L 1983,360 L 1993,760 L 1556,756 L 1522,753 Z", text: "琅嶠社寮", type: "switch", page: 2, delay: 100 },
          { d: "M 1536,838 L 1990,848 L 1993,1224 L 1525,1210 Z", text: "斯卡羅", type: "switch", page: 3, delay: 100 },
          { d: "M 1532,1285 L 1986,1289 L 1986,1688 L 1536,1695 Z", text: "出火", type: "switch", page: 4, delay: 100 }
        ]
      },
      2: {
        bg: "傀儡花_琅嶠社寮.png",
        hotspots: [
          { 
            d: "M 0,0 L 2048,0 L 2048,2048 L 0,2048 Z", 
            text: "關於我們選用的畫面分為以下四幕：\n第一幕採用「羅妹號事件」的緣起，\n第二幕則是客家與平埔族等多元族群混居的「瑯嶠社寮」，\n第三幕將目光放在「斯卡羅」原住民的居住場所，\n第四幕「出火」，是本事件的暫時停損點，\n也是原住民與西方簽訂〈南岬之盟〉的關鍵談判場域。", 
            type: "guide" 
          },
          { d: "M 1696,1965 L 2034,1958 L 2037,2040 L 1699,2036 Z", text: "文學水墨數位轉譯", type: "dialog" },
          { d: "M 24,1732 L 338,1732 L 334,2023 L 20,2026 Z", text: "點擊任一處可跳出解說文字框", type: "dialog" },
          { d: "M 143,132 L 614,121 L 665,388 L 146,391 Z", text: "傀儡花，作者陳耀昌。", type: "dialog" },
          { d: "M 348,456 L 1413,452 L 1416,1548 L 375,1538 L 334,1538 Z", text: "琅嶠社寮", type: "link", target: "社寮（一）.html", delay: 300 },
          { d: "M 1525,381 L 1983,360 L 1993,760 L 1556,756 L 1522,753 Z", text: "羅妹號", type: "switch", page: 1, delay: 100 },
          { d: "M 1536,838 L 1990,848 L 1993,1224 L 1525,1210 Z", text: "斯卡羅", type: "switch", page: 3, delay: 100 },
          { d: "M 1532,1285 L 1986,1289 L 1986,1688 L 1536,1695 Z", text: "出火", type: "switch", page: 4, delay: 100 }
        ]
      },
      3: {
        bg: "傀儡花_斯卡羅.png",
        hotspots: [
          { 
            d: "M 0,0 L 2048,0 L 2048,2048 L 0,2048 Z", 
            text: "關於我們選用的畫面分為以下四幕：\n第一幕採用「羅妹號事件」的緣起，\n第二幕則是客家與平埔族等多元族群混居的「瑯嶠社寮」，\n第三幕將目光放在「斯卡羅」原住民的居住場所，\n第四幕「出火」，是本事件的暫時停損點，\n也是原住民與西方簽訂〈南岬之盟〉的關鍵談判場域。", 
            type: "guide" 
          },
          { d: "M 1696,1965 L 2034,1958 L 2037,2040 L 1699,2036 Z", text: "文學水墨數位轉譯", type: "dialog" },
          { d: "M 24,1732 L 338,1732 L 334,2023 L 20,2026 Z", text: "點擊任一處可跳出解說文字框", type: "dialog" },
          { d: "M 143,132 L 614,121 L 665,388 L 146,391 Z", text: "傀儡花，作者陳耀昌。", type: "dialog" },
          { d: "M 348,456 L 1413,452 L 1416,1548 L 375,1538 L 334,1538 Z", text: "斯卡羅", type: "link", target: "村落(二).html", delay: 300 },
          { d: "M 1525,381 L 1983,360 L 1993,760 L 1556,756 L 1522,753 Z", text: "羅妹號", type: "switch", page: 1, delay: 100 },
          { d: "M 1536,838 L 1990,848 L 1993,1224 L 1525,1210 Z", text: "琅嶠社寮", type: "switch", page: 2, delay: 100 },
          { d: "M 1532,1285 L 1986,1289 L 1986,1688 L 1536,1695 Z", text: "出火", type: "switch", page: 4, delay: 100 }
        ]
      },
      4: {
        bg: "傀儡花_出火.png",
        hotspots: [
          { 
            d: "M 0,0 L 2048,0 L 2048,2048 L 0,2048 Z", 
            text: "關於我們選用的畫面分為以下四幕：\n第一幕採用「羅妹號事件」的緣起，\n第二幕則是客家與平埔族等多元族群混居的「瑯嶠社寮」，\n第三幕將目光放在「斯卡羅」原住民的居住場所，\n第四幕「出火」，是本事件的暫時停損點，\n也是原住民與西方簽訂〈南岬之盟〉的關鍵談判場域。", 
            type: "guide" 
          },
          { d: "M 1696,1965 L 2034,1958 L 2037,2040 L 1699,2036 Z", text: "文學水墨數位轉譯", type: "dialog" },
          { d: "M 24,1732 L 338,1732 L 334,2023 L 20,2026 Z", text: "點擊任一處可跳出解說文字框", type: "dialog" },
          { d: "M 143,132 L 614,121 L 665,388 L 146,391 Z", text: "傀儡花，作者陳耀昌。", type: "dialog" },
          { d: "M 348,456 L 1413,452 L 1416,1548 L 375,1538 L 334,1538 Z", text: "出火", type: "link", target: "尾聲（三）.html", delay: 300 },
          { d: "M 1525,381 L 1983,360 L 1993,760 L 1556,756 L 1522,753 Z", text: "羅妹號", type: "switch", page: 1, delay: 100 },
          { d: "M 1536,838 L 1990,848 L 1993,1224 L 1525,1210 Z", text: "琅嶠社寮", type: "switch", page: 2, delay: 100 },
          { d: "M 1532,1285 L 1986,1289 L 1986,1688 L 1536,1695 Z", text: "斯卡羅", type: "switch", page: 3, delay: 100 }
        ]
      }
    };

    // 渲染當前頁面的背景與熱點
    function renderPage(pageNum) {
      currentPage = pageNum;
      const data = pagesData[pageNum];
      
      // 切換背景圖片
      document.getElementById('bgImage').src = data.bg;

      // 清空並重新生成 SVG 熱點
      const svg = document.getElementById('hotspotSvg');
      svg.innerHTML = '';

      data.hotspots.forEach(item => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "hotspot");
        path.setAttribute("d", item.d);
        
        path.addEventListener('click', (event) => {
          event.stopPropagation();
          ensureBgmPlaying();
          playClickFeedback();
          
          const dialog = document.getElementById('dialog');
          
          // 如果對話框目前正在顯示，再次點擊時則直接關閉對話框，並可選擇是否順便停止音檔
          if (dialog.classList.contains('active')) {
            closeDialog();
            if (!audio.paused) {
              audio.pause();
              audio.currentTime = 0;
              syncBgmVolume();
            }
            return;
          }

          createRipple(event);
          
          // 處理語音播放與打斷機制
          if (!audio.paused) {
            audio.pause();
            audio.currentTime = 0;
            syncBgmVolume();
          } else {
            audio.play().then(() => {
              syncBgmVolume();
            }).catch(err => {
              console.log("音檔播放需要使用者互動解鎖", err);
              syncBgmVolume();
            });
          }

          if (item.type === "dialog" || item.type === "guide") {
            let duration = (item.type === "guide") ? 33000 : 3000;
            showDialog(item.text, duration);
          } else if (item.type === "switch") {
            showDialog(item.text, 3000);
            setTimeout(() => {
              renderPage(item.page);
            }, item.delay);
          } else if (item.type === "link") {
            showDialog(item.text, 3000);
            setTimeout(() => {
              window.location.href = item.target;
            }, item.delay);
          }
        });

        svg.appendChild(path);
      });
    }

    // 產生點擊光點特效
    function createRipple(event) {
      const wrapper = document.getElementById('wrapper');
      const rect = wrapper.getBoundingClientRect();
      
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;

      wrapper.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 100);
    }

    function showDialog(text, duration = 3000) {
      const dialog = document.getElementById('dialog');
      dialog.innerText = text;
      dialog.classList.add('active');

      if (timer) clearTimeout(timer);

      timer = setTimeout(() => {
        closeDialog();
      }, duration);
    }

    function closeDialog() {
      const dialog = document.getElementById('dialog');
      dialog.classList.remove('active');
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
    }

    // 網頁載入時預設顯示首頁一，並嘗試啟動背景音樂
    window.onload = function() {
      renderPage(1);
      ensureBgmPlaying();
    };

    // 若載入當下被瀏覽器阻擋自動播放，使用者首次點擊頁面任何地方時啟動背景音樂
    document.addEventListener('pointerdown', () => {
      if (!bgmStarted) {
        ensureBgmPlaying();
      }
    }, { once: true });
  </script>

</body>
</html>
